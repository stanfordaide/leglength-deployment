# Prometheus Configuration
# Pre-configured to scrape Orthanc and other services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'leglength-deployment'

rule_files:
  - '/etc/prometheus/alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # =============================================================================
  # SELF-MONITORING
  # =============================================================================
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # =============================================================================
  # ORTHANC PACS - Built-in Prometheus metrics
  # =============================================================================
  
  - job_name: 'orthanc'
    static_configs:
      - targets: ['172.20.0.1:9011']
    metrics_path: '/tools/metrics-prometheus'
    scrape_interval: 30s
    scrape_timeout: 10s
    basic_auth:
      username: 'orthanc_admin'
      password: 'helloaide123'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'orthanc'

  # =============================================================================
  # GRAFANA (optional - for monitoring Grafana itself)
  # =============================================================================
  
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # =============================================================================
  # HOST + CONTAINER EXPORTERS
  # =============================================================================

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # =============================================================================
  # TCP DOWNTIME PROBES (Mercure/Orthanc reachability)
  # =============================================================================

  - job_name: 'mercure-blackbox'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '172.17.0.1:9020'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'orthanc-blackbox'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '172.17.0.1:9010'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
